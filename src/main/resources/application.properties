spring.application.name=task-manager
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/task_manager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456789

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT (secret must be at least 32 characters - override via env var in real use)
jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
jwt.expiration-ms=86400000
